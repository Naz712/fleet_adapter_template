<title>RB4107 Track Assembly</title>

<style>
/* Layout: one-screen app. Control bar on top, the 3D stage fills the rest, an info panel on the right (below on phones). */
:root {
  --bg: #efede7; --panel: #ffffff; --fg: #1d1f23; --muted: #5f646c; --line: #d6d2c8; --soft: #f7f6f2;
  --accent: #d9671f; --accent-ink: #ffffff;

  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141619; --panel: #1d2024; --fg: #e9e7e2; --muted: #a4a8ae; --line: #343940; --soft: #23272c; --accent: #f08a3e; --accent-ink: #1a1a1a; --ghost: #3a4049; color-scheme: dark }
}
:root[data-theme="dark"] { --bg: #141619; --panel: #1d2024; --fg: #e9e7e2; --muted: #a4a8ae; --line: #343940; --soft: #23272c; --accent: #f08a3e; --accent-ink: #1a1a1a; --ghost: #3a4049; color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  display: flex; flex-direction: column; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px 8px; border-bottom: 1px solid var(--line) }
.bar h1 { font-size: 16px; font-weight: 600; margin: 0 12px 0 0; letter-spacing: .01em; text-wrap: balance }
.bar .sub { color: var(--muted); font-size: 12.5px; margin-right: auto }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted) }
.ctl label { white-space: nowrap }
.ctl input[type=range] { width: 130px; accent-color: var(--accent) }
.ctl select, .ctl button { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px }
.ctl button { cursor: pointer } .ctl button:hover { border-color: var(--accent) }
.ctl input[type=checkbox] { accent-color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; gap: 12px; padding-block: 10px 12px }
#stage { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--soft) }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none }
#markers { position: absolute; inset: 0; pointer-events: none }
.mk { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  font: 500 11px/22px var(--font-data); text-align: center; border: 2px solid var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.35); pointer-events: auto; cursor: pointer; user-select: none }
.mk.on { background: var(--fg); color: var(--bg) }
#loading[hidden] { display: none }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-data); font-size: 13px; background: var(--soft) }
#hint { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 3px 7px; border-radius: 5px; pointer-events: none }
aside { min-width: 0; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; box-sizing: border-box }
aside h2 { font-size: 15px; margin: 0 0 4px; text-wrap: balance }
aside .tag { display: inline-block; font: 500 11px/1 var(--font-data); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; margin: 2px 6px 10px 0 }
.tag.mine { background: var(--mine); color: #fff } .tag.buy { background: var(--buy); color: #111 } .tag.theirs { background: var(--theirs); color: #fff } .tag.deck { background: var(--deck); color: #222 } .tag.other { background: var(--ghost); color: var(--fg) }

aside ol { padding-left: 20px; margin: 4px 0 0 } aside li { margin-bottom: 3px }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 12.5px; margin-top: 6px }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line) }
.steps button { display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px; color: var(--fg); background: none; border: 1px solid transparent; border-radius: 5px; padding: 4px 6px; cursor: pointer }
.steps button.on { border-color: var(--accent); background: var(--soft) }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 38%) }
  .ctl input[type=range] { width: 90px }
}
</style>

<header class="bar">
  <h1>RB4107 Track Assembly</h1>
  <span class="sub">1:5 prototype. Nhien's Rev B frame with the printed track. Drag to orbit, scroll to zoom, click a part.</span>
  <div class="ctl"><label for="explode">Explode</label><input id="explode" type="range" min="0" max="100" value="55"></div>
  <div class="ctl"><label for="bend">Hinge</label><input id="bend" type="range" min="-40" max="40" value="0"><span id="bendv" style="font-family:var(--font-data);min-width:3.5ch">0°</span></div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const INFO = {
  track_front: { n: 1, t: 'Front track', k: 'mine', role: 'The printed TPU belt: 110 teeth inside sit in the wheel grooves, 45 cleats outside are spaced so five span one ES1 step. Drives the front segment over the step edges.', fast: 'No fastener. Teeth mesh in the wheel grooves.\nTension: slide the nose idler outwards in the plate slot, then tighten its nut.', src: 'Make: Fab Lab UP300, TPU 95A, file stl/track_TPU_x4.stl. Qty 4.' },
  wheel_hinge_front: { n: 2, t: 'Hinge wheel, front segment (M1)', k: 'buy', role: 'HTD 5M 20-tooth timing pulley on the hinge shaft. The shaft turns it, it drives the front track.', fast: 'D-bore 8 on the shaft\'s flat: no set screw.\nHeld along the shaft by E-clip DIN 6799-6 + shim 8 x 11 x 1.', src: 'Buy plain-bore from MISUMI SG, bore to D-shape at the Professional Workshop (Rev B sheet 21).' },
  wheel_nose: { n: 3, t: 'Nose idler wheel (M2)', k: 'buy', role: 'Same 20-tooth pulley, bored to 16 mm with two 688 bearings inside. It only turns with the track.', fast: 'ISO 7379 shoulder screw Ø8 x 25, M6 thread, through the plate slot:\n8 x 11 x 1 washer, 8 x 11 x 0.5 shim, spacer 8 x 10 x 9, M6 washer + nyloc nut.', src: 'Buy plain-bore from MISUMI SG, bore Ø16 H7 at the workshop. Shoulder screw: RS SG or MISUMI.' },
  shaft: { n: 4, t: 'Hinge shaft P20', k: 'buy', role: 'Ø8 D-shaft (flat 7). The hinge axis: both segments turn about it, and the drive belt pulley on it turns the hinge wheels. Two half shafts, A 82.3 and B 77.3, one per motor.', fast: 'Runs in 688-2RS bearings in the front plate, the rear plate and the P17 support on the middle bar.\nE-clip DIN 6799-6 + shim 8 x 11 x 1 at each end.', src: 'Buy Ø8 D-shaft stock (RS SG or MISUMI), cut to length, E-clip grooves per Rev B sheet 20.' },
  plate_front: { n: 5, t: 'Front side plate P1', k: 'theirs', role: '5 mm aluminium, 255 x 30.4. Carries the hinge bearing, the nose idler slot, the rail brackets and the 2020 bar brackets. Inboard, at z 55 to 60.', fast: '688-2RS pressed in the Ø16 hinge hole.\nTo each 2020 bar: P19 corner bracket, M5 x 8 + slot-6 T-nut into the bar, 2 x M4 x 8 into the tapped plate.', src: 'Nhien: laser cut from DXF P1, drill and tap per Rev B sheet 4. One left, one right.' },
  rail_front_lower: { n: 6, t: 'Slide rails P3 / P4', k: 'theirs', role: 'UHMW strips the upper and lower track runs slide on, so the track cannot sag between the wheels.', fast: 'RS 427-991 angle bracket at each end: M3 x 6 into the tapped plate, 3 x 5 PT screw into the rail.', src: 'MISUMI UPA-189-20-5 strip, 3 pilot holes drilled. 8 strips in all.' },
  rail_front_upper: { n: 6, t: 'Slide rail P3 (upper)', k: 'theirs', role: 'Upper UHMW strip the top run slides on.', fast: 'RS 427-991 bracket: M3 x 6 into the plate, 3 x 5 PT screw into the rail.', src: 'MISUMI UPA-189-20-5.' },
  bearing_front_plate: { n: 7, t: 'Bearing 688-2RS', k: 'buy', role: '8 x 16 x 5 ball bearing. The hinge shaft turns in it while the plate stays still.', fast: 'Light press fit in the plate\'s Ø16 hole. Loctite 641 on the outer ring if loose.', src: 'RS Singapore, 14 in all: 4 in plates, 2 in P17 supports, 8 in idler wheels.' },
  bearing_rear_plate: { n: 7, t: 'Bearing 688-2RS (rear plate)', k: 'buy', role: 'Same bearing, in the rear plate\'s hinge hole.', fast: 'Light press fit in the Ø16 hole.', src: 'RS Singapore.' },
  bearing_support: { n: 7, t: 'Bearing 688-2RS (P17 support)', k: 'buy', role: 'Third bearing for each hinge half-shaft, in the P17 support on the middle bar.', fast: 'Press fit in P17; P17 to the 3030 bar with 2 x M5 x 10 + T-nuts.', src: 'RS Singapore.' },
  bearing_idler: { n: 7, t: 'Bearing 688-2RS (inside an idler wheel)', k: 'buy', role: 'Two per idler wheel, on the shoulder screw.', fast: 'Press fit in the wheel\'s Ø16 bore.', src: 'RS Singapore.' },
  plate_rear: { n: 8, t: 'Rear side plate P2', k: 'theirs', role: 'Same plate as P1 for the rear segment, outboard at z 80 to 85. The rear track runs outside it.', fast: '688-2RS in the hinge hole; rear idler on a shoulder screw through the slot.\nTo each 3030 bar: P18 corner bracket, M6 x 10 + slot-8 T-nut into the bar, 2 x M5 x 8 into the plate.', src: 'Nhien: laser cut from DXF P2, Rev B sheet 5. One left, one right.' },
  track_rear: { n: 9, t: 'Rear track', k: 'mine', role: 'Same printed track, on the rear hinge wheel and the rear idler, outboard of the rear plate.', fast: 'No fastener. Tension at the rear idler slot.', src: 'Make: same file, 4 tracks in all.' },
  wheel_hinge_rear: { n: 10, t: 'Hinge wheel, rear segment (M1)', k: 'buy', role: 'Outermost wheel on the hinge shaft. Drives the rear track.', fast: 'D-bore on the shaft flat, E-clip at the shaft end.', src: 'Buy plain-bore, D-bore at the workshop.' },
  wheel_rear: { n: 11, t: 'Rear idler wheel (M2)', k: 'buy', role: 'Idler at the back of the rear segment, on bearings.', fast: 'Same shoulder-screw set as the nose idler, through the rear plate\'s slot.', src: 'Buy plain-bore, bore Ø16 at the workshop.' },
  rail_rear_lower: { n: 12, t: 'Slide rails P5 / P6', k: 'theirs', role: 'Rails for the rear track, on the outboard face of the rear plate.', fast: 'Same brackets and screws as the front rails.', src: 'MISUMI UPA-189-20-5.' },
  rail_rear_upper: { n: 12, t: 'Slide rail P5 (upper)', k: 'theirs', role: 'Upper rail for the rear track.', fast: 'RS 427-991 bracket: M3 x 6 into the plate, 3 x 5 PT screw into the rail.', src: 'MISUMI UPA-189-20-5.' },
  bar_2020: { n: 13, t: 'Cross bars 2020 x 110 (P7)', k: 'theirs', role: 'Two aluminium profiles that hold the front plates 110 apart. The hinge sector gear sits on one of them.', fast: 'P19 brackets to the plates (M5 x 8 + T-nut, 2 x M4 x 8).\nSector gear P11 on angle P14: 2 x M3 x 8 csk into the gear, 2 x M4 x 8 csk + slot-6 T-nuts into the bar.', src: '2020 B-type profile, slot 6, cut to 110. MISUMI SG or local.' },
  bar_3030: { n: 14, t: 'Cross bars 3030 x 160 (P8)', k: 'theirs', role: 'Two heavier profiles that hold the rear plates 160 apart and carry the deck.', fast: 'P18 brackets to the plates (M6 x 10 + T-nut, 2 x M5 x 8).\nDeck on top: 8 x M5 x 12 csk + slot-8 T-nuts. P17 hinge supports: 2 x M5 x 10 + T-nuts each.', src: '3030 B-type profile, slot 8, cut to 160.' },
  deck: { n: 15, t: 'Deck plate P12', k: 'deck', role: '5 mm aluminium floor on the 3030 bars. Motors, hinge motor, drivers and the posts for the tray mount on it. This is the box.', fast: 'To the bars: 8 x M5 x 12 csk + T-nuts.\nPosts P15: M6 x 16 csk from below. Drive motors on P9 shim + Pololu bracket, M3 x 12. Hinge motor 5840 on its L-bracket: 4 x M4 x 8 csk, 2 x M5 x 8 into the deck.', src: 'Nhien: laser cut, Rev B sheets 6 and 7.' },
  tray: { n: 15, t: 'Tray plate P16', k: 'deck', role: 'Upper deck for the controller, battery and cover.', fast: 'To the posts: 4 x M6 x 16 from the top. Cover P22: 4 x M3 x 25.', src: 'Nhien: laser cut, Rev B sheet 8.' },
  other: { n: 0, t: 'Rev B hardware', k: 'other', role: 'Screws, T-nuts, brackets, posts, motors, belts, electronics or the cover from Nhien\'s Rev B pack.', fast: 'See Rev B sheet 3 (joint and fastener schedule).', src: 'Rev B bill of materials.' }
};
const STEPS = ['All parts', '1  Bearings into plates, P17 and idlers', '2  Rear frame: P2 + 3030 bars + P18', '3  Front frame: P1 + 2020 bars + P19 + sector gear', '4  Hinge shaft, hinge wheels, E-clips', '5  Deck, posts, tray', '6  Motors, belts, tension', '7  Idlers on shoulder screws, tracks on, tension', '8  Electronics and cover'];
const TM = [0, 1.0, 2.3, 3.6, 4.9];

function keyOf(p) {
  const ax = Math.abs(p.xc);
  switch (p.c) {
    case 'track': return p.xc > 0 ? 'track_front' : 'track_rear';
    case 'pulley': if (p.xc > 150) return 'wheel_nose'; if (p.xc < -150) return 'wheel_rear'; return p.tier >= 4 ? 'wheel_hinge_rear' : 'wheel_hinge_front';
    case 'plate_front': return 'plate_front';
    case 'plate_rear': return 'plate_rear';
    case 'hinge_shaft': return 'shaft';
    case 'rail': return p.xc > 0 ? (p.yc < 0 ? 'rail_front_lower' : 'rail_front_upper') : (p.yc < 0 ? 'rail_rear_lower' : 'rail_rear_upper');
    case 'bar': return p.xc > 0 ? 'bar_2020' : 'bar_3030';
    case 'bearing': if (ax > 100) return 'bearing_idler'; return p.tier === 1 ? 'bearing_front_plate' : p.tier === 3 ? 'bearing_rear_plate' : 'bearing_support';
    case 'deck': return p.yc < 60 ? 'deck' : 'tray';
    default: return 'other';
  }
}
function stepOf(p, key) {
  if (p.c === 'bearing') return 1;
  if (key === 'plate_rear' || key === 'bar_3030' || key.startsWith('rail_rear')) return 2;
  if (key === 'plate_front' || key === 'bar_2020' || key.startsWith('rail_front')) return 3;
  if (key === 'shaft' || key.startsWith('wheel_hinge')) return 4;
  if (key === 'deck' || key === 'tray') return 5;
  if (key === 'wheel_nose' || key === 'wheel_rear' || p.c === 'track') return 7;
  if (p.yc > 60) return 8;
  if (p.yc > 25) return p.xc < -80 || p.xc > 40 ? 6 : 5;
  return p.xc < 0 ? 2 : 3;
}
function isFront(p, key) {
  if (key === 'deck' || key === 'tray' || key === 'shaft' || key.startsWith('wheel_hinge') || key === 'bearing_support') return false;
  if (p.c === 'other') return p.xc > 30 && p.yc < 25;
  return p.xc > 30;
}

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const stage = document.getElementById('stage'), markersEl = document.getElementById('markers'), panel = document.getElementById('panel');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.45));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(250, 420, 320); scene.add(sun);
const camera = new THREE.PerspectiveCamera(33, 1, 1, 6000);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.1;
const HOME = { pos: new THREE.Vector3(420, 330, 820), tgt: new THREE.Vector3(0, 15, 40) };
function resetView() { camera.position.copy(HOME.pos); controls.target.copy(HOME.tgt); controls.update(); }
resetView();
const front = new THREE.Group(), rear = new THREE.Group(); scene.add(front, rear);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.ShadowMaterial({ opacity: 0 })); ground.visible = false; scene.add(ground);

function applyTheme() {
  renderer.setClearColor(new THREE.Color(css('--soft')));
  for (const m of meshes) if (m.userData.p.c === 'other') m.material.color.set(css('--ghost'));
}
const meshes = [], byKey = {};
const colorFor = (k, c) => k === 'mine' ? css('--mine') : k === 'buy' ? css('--buy') : k === 'theirs' ? css('--theirs') : k === 'deck' ? css('--deck') : css('--ghost');

async function load() {
  const [idx, b64] = await Promise.all([fetch('parts.json').then(r => r.json()), fetch('parts.b64.txt').then(r => r.text())]);
  const bin = atob(b64.trim()), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); const buf = bytes.buffer;
  for (const p of idx.parts) {
    const q = new Uint16Array(buf, p.o, p.v * 3), pos = new Float32Array(p.v * 3);
    for (let i = 0; i < p.v; i++) for (let k = 0; k < 3; k++) pos[i * 3 + k] = p.mn[k] + q[i * 3 + k] / 65535 * (p.mx[k] - p.mn[k]);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.computeVertexNormals();
    const key = keyOf(p), info = INFO[key];
    const metal = ['buy'].includes(info.k) ? 0.75 : 0.05;
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(colorFor(info.k, p.c)), metalness: metal, roughness: 0.5, envMapIntensity: 0.4 });
    if (p.c === 'other') { mat.transparent = true; mat.opacity = 0.12; }
    const m = new THREE.Mesh(g, mat); m.userData = { p, key, step: stepOf(p, key), side: p.zc > 0 ? 1 : -1, base: mat.color.clone() };
    (isFront(p, key) ? front : rear).add(m); meshes.push(m);
    if (!byKey[key] || (p.zc > 0 && byKey[key].userData.p.zc <= 0)) byKey[key] = m;
  }
  document.getElementById('loading').hidden = true;
  buildMarkers(); update(); showInfo(null);
}

const state = { explode: 0.55, bend: 0, ghost: true, step: 0, sel: null };
function update() {
  for (const m of meshes) {
    const { p, step, side } = m.userData;
    m.position.z = (side > 0 ? 1 : 0) * TM[p.tier] * 36 * state.explode;   // near side explodes outwards
    m.visible = state.step === 0 || step <= state.step;
    if (p.c === 'other') { m.material.transparent = true; m.material.opacity = state.ghost ? 0.12 : 1; m.material.depthWrite = !state.ghost; }
  }
  front.rotation.z = THREE.MathUtils.degToRad(state.bend);
}
const NUMBERED = ['track_front', 'wheel_hinge_front', 'wheel_nose', 'shaft', 'plate_front', 'rail_front_lower', 'bearing_front_plate', 'plate_rear', 'track_rear', 'wheel_hinge_rear', 'wheel_rear', 'rail_rear_lower', 'bar_2020', 'bar_3030', 'deck'];
const markers = [];
function buildMarkers() {
  for (const key of NUMBERED) {
    const m = byKey[key]; if (!m) continue;
    const el = document.createElement('button'); el.className = 'mk'; el.type = 'button'; el.textContent = INFO[key].n; el.title = INFO[key].t;
    el.addEventListener('click', (e) => { e.stopPropagation(); select(m); });
    markersEl.appendChild(el); markers.push({ el, m, key });
  }
}
const v = new THREE.Vector3();
function placeMarkers() {
  const r = renderer.domElement.getBoundingClientRect();
  for (const { el, m } of markers) {
    if (!m.visible) { el.hidden = true; continue; }
    const b = m.geometry.boundingBox || (m.geometry.computeBoundingBox(), m.geometry.boundingBox);
    v.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, (b.min.z + b.max.z) / 2); m.localToWorld(v); v.project(camera);
    if (v.z > 1) { el.hidden = true; continue; }
    el.hidden = false; el.style.left = ((v.x + 1) / 2 * r.width) + 'px'; el.style.top = ((1 - v.y) / 2 * r.height) + 'px';
    el.classList.toggle('on', state.sel === m);
  }
}
function select(m) {
  if (state.sel) state.sel.material.emissive.set(0x000000);
  state.sel = m;
  if (m) { m.material.emissive.set(new THREE.Color(css('--accent'))); m.material.emissiveIntensity = 0.55; }
  showInfo(m);
}
function showInfo(m) {
  if (!m) {
    panel.innerHTML = `<h2>Click any part</h2><p>Each part shows what it does, how it is fastened to its neighbours, and where it comes from. The orange numbers are the 15 joints of the connection map, in assembly order from the track outwards.</p>
      <h3>Colours</h3><div class="legend"><span class="sw" style="background:var(--mine)"></span>my printed track<span class="sw" style="background:var(--buy)"></span>bought: wheels, bearings, shaft<span class="sw" style="background:var(--theirs)"></span>Nhien's plates, rails, bars<span class="sw" style="background:var(--deck)"></span>deck and tray (the box)<span class="sw" style="background:var(--ghost)"></span>screws, motors, electronics (faded)</div>
      <h3>Build step</h3><div class="steps">${STEPS.map((s, i) => `<button type="button" data-step="${i}" class="${i === state.step ? 'on' : ''}">${s}</button>`).join('')}</div>
      <p style="margin-top:8px;color:var(--muted);font-size:12px">Steps follow Rev B sheet 3. Small hardware is placed by its position, so a few screws may appear a step early.</p>`;
    panel.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { state.step = +b.dataset.step; update(); showInfo(null); }));
    return;
  }
  const i = INFO[m.userData.key], p = m.userData.p;
  panel.innerHTML = `<h2>${i.n ? i.n + '.  ' : ''}${i.t}</h2><span class="tag ${i.k}">${i.k === 'mine' ? 'mine, printed' : i.k === 'buy' ? 'bought' : i.k === 'theirs' ? "Nhien's part" : i.k === 'deck' ? 'the box' : 'Rev B hardware'}</span>
    <h3>What it does</h3><p>${i.role}</p><h3>How it is fastened</h3><div class="fast">${i.fast}</div><h3>Where it comes from</h3><p>${i.src}</p>
    <h3>Position (mm, 1:5)</h3><p style="font-family:var(--font-data);font-size:12.5px">x ${p.xc.toFixed(0)}, y ${p.yc.toFixed(0)}, z ${p.zc.toFixed(0)} from the hinge axis; across-width layer ${p.tier}</p>
    <p><button type="button" id="back" style="font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer">Back to the list</button></p>`;
  panel.querySelector('#back').addEventListener('click', () => select(null));
}

// picking (click, not drag)
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) { down = null; return; } down = null;
  const r = renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(meshes.filter(m => m.visible && !(state.ghost && m.userData.p.c === 'other')), false);
  select(hits.length ? hits[0].object : null);
});
document.getElementById('explode').addEventListener('input', (e) => { state.explode = e.target.value / 100; update(); });
document.getElementById('bend').addEventListener('input', (e) => { state.bend = +e.target.value; document.getElementById('bendv').textContent = state.bend + '°'; update(); });
document.getElementById('ghost').addEventListener('change', (e) => { state.ghost = e.target.checked; update(); });
document.getElementById('reset').addEventListener('click', resetView);

function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
applyTheme();
(function loop() { controls.update(); renderer.render(scene, camera); placeMarkers(); requestAnimationFrame(loop); })();
load().catch((err) => { document.getElementById('loading').textContent = 'The model could not be loaded: ' + err.message; });
</script>
